name: CI

# Chạy khi push và khi mở pull request — bắt lỗi TRƯỚC khi merge vào main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) Chạy test. test_cp5.py cần một bản deploy sống nên bị loại khỏi CI;
  #    test_bonus_cicd.py chấm chính workflow này nên cũng loại để tránh vòng lặp.
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy pytest (bỏ test cần deploy sống)
        env:
          AGENT_API_KEY: test-api-key-cua-lab
          REDIS_URL: "fake://"
        run: |
          pytest -v \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  # 2) Build thử Docker image — Dockerfile hỏng phải lộ ở đây, không phải lúc deploy.
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

  # 3) Deploy — CHỈ chạy sau khi test + build xanh, và CHỈ trên nhánh main.
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Gọi Render Deploy Hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Chưa cấu hình RENDER_DEPLOY_HOOK_URL — bỏ qua bước deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
